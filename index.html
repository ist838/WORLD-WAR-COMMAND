
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD WAR COMMAND</title>

<style>
* { box-sizing:border-box; }

body {
    margin:0;
    background:#080d16;
    color:white;
    font-family:Arial,sans-serif;
}

header {
    height:65px;
    padding:18px 25px;
    background:#101a2a;
    border-bottom:1px solid #293b55;
    font-size:21px;
    font-weight:bold;
}

header span {
    color:#45a5ff;
}

#login {
    max-width:430px;
    margin:100px auto;
    padding:30px;
    background:#111d30;
    border:1px solid #304968;
    border-radius:12px;
}

input,button {
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:6px;
    font-size:15px;
}

input {
    background:#202e42;
    color:white;
}

button {
    background:#1976d2;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover { background:#3295f5; }

#game {
    display:none;
    padding:15px;
}

.topbar {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.info {
    background:#17253a;
    padding:12px 18px;
    border-radius:7px;
}

.layout {
    display:grid;
    grid-template-columns:minmax(0,1fr) 270px;
    gap:15px;
}

.panel {
    background:#111d30;
    border:1px solid #293d58;
    border-radius:10px;
    padding:15px;
}

#map {
    position:relative;
    width:100%;
    height:540px;
    overflow:hidden;
    border-radius:8px;
    background:
      radial-gradient(ellipse at 50% 50%,#183b50,#102538 65%,#091827);
}

#map canvas {
    width:100%;
    height:100%;
    cursor:pointer;
}

.country-list {
    max-height:380px;
    overflow-y:auto;
}

.country {
    padding:10px;
    margin:7px 0;
    background:#1c2d43;
    border-radius:6px;
    cursor:pointer;
}

.country:hover { background:#294767; }

.country.selected { outline:2px solid #45a5ff; }

small { color:#a9bdd5; }

#status {
    color:#72c4ff;
    margin-top:12px;
}

#players {
    margin-top:15px;
}

@media(max-width:800px) {
    .layout { grid-template-columns:1fr; }
    #map { height:420px; }
}
</style>
</head>

<body>

<header>
WORLD WAR <span>COMMAND</span>
</header>

<div id="login">
    <h2>온라인 전쟁 참가</h2>
    <p>닉네임과 방 코드를 입력하세요.</p>

    <input id="name" placeholder="닉네임">

    <input id="room" placeholder="방 코드 (비우면 새 방 생성)">

    <button onclick="joinGame()">게임 시작</button>

    <p id="loginStatus"></p>
</div>

<div id="game">

    <div class="topbar">
        <div class="info">방: <b id="roomCode">-</b></div>
        <div class="info">국가: <b id="nation">-</b></div>
        <div class="info">보유 금: <b id="gold">0</b></div>
        <div class="info">온라인: <b id="online">0</b></div>
    </div>

    <div class="layout">

        <div class="panel">
            <h3>WORLD MAP</h3>

            <div id="map">
                <canvas id="world"></canvas>
            </div>

            <p id="status">서버 연결 대기 중...</p>
            <p><small>내 국가를 선택한 후 다른 인접 국가를 선택하면 공격할 수 있습니다.</small></p>
        </div>

        <div class="panel">
            <h3>국가 목록</h3>
            <div class="country-list" id="countries"></div>

            <hr style="border-color:#293d58;margin:20px 0">

            <h3>작전 명령</h3>

            <button onclick="train()">병력 생산 (-10 금, +5 병력)</button>

            <button onclick="attack()">선택한 국가 공격</button>

            <button onclick="selectClear()">선택 초기화</button>

            <div id="players">
                <h3>플레이어</h3>
                <div id="playerList"></div>
            </div>
        </div>

    </div>
</div>

<script>
let playerId = "";
let roomCode = "";
let myNation = "";
let socket = null;
let gameState = null;

let selectedOrigin = null;
let selectedTarget = null;

const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

function countryName(id) {
    return gameState?.map?.[id]?.name || id;
}

async function joinGame() {
    const name = $("name").value.trim();
    const room = $("room").value.trim();

    if (!name) {
        alert("닉네임을 입력하세요.");
        return;
    }

    $("loginStatus").textContent = "서버에 연결 중...";

    try {
        const response = await fetch("/api/join", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name,room})
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.detail || "참가 실패");
        }

        playerId = result.player_id;
        roomCode = result.room;
        myNation = result.nation;

        $("login").style.display = "none";
        $("game").style.display = "block";

        $("roomCode").textContent = roomCode;
        $("nation").textContent = countryName(myNation);

        connectSocket();

    } catch(error) {
        $("loginStatus").textContent = error.message;
    }
}

function connectSocket() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";

    socket = new WebSocket(
        `${protocol}//${location.host}/ws/${roomCode}/${playerId}`
    );

    socket.onopen = () => {
        $("status").textContent = "온라인 서버 연결 완료";
    };

    socket.onmessage = event => {
        const message = JSON.parse(event.data);

        if (message.type === "state") {
            gameState = message.data;
            updateUI();
        }

        if (message.type === "error") {
            $("status").textContent = message.message;
        }
    };

    socket.onclose = () => {
        $("status").textContent = "서버 연결이 끊어졌습니다.";
    };
}

function sendAction(action) {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert("서버에 연결되지 않았습니다.");
        return;
    }

    socket.send(JSON.stringify(action));
}

function train() {
    if (!selectedOrigin) {
        alert("병력을 생산할 내 국가를 선택하세요.");
        return;
    }

    sendAction({
        action:"train",
        country:selectedOrigin
    });
}

function attack() {
    if (!selectedOrigin || !selectedTarget) {
        alert("공격할 국가 두 곳을 선택하세요.");
        return;
    }

    sendAction({
        action:"attack",
        origin:selectedOrigin,
        target:selectedTarget
    });
}

function selectClear() {
    selectedOrigin = null;
    selectedTarget = null;
    updateUI();
}

function selectCountry(id) {
    const country = gameState.countries[id];

    if (country.owner === myNation) {
        selectedOrigin = id;
        selectedTarget = null;
    } else if (selectedOrigin) {
        selectedTarget = id;
    }

    updateUI();
}

function updateUI() {
    if (!gameState) return;

    const players = gameState.players;

    const me = players[playerId];

    if (me) {
        $("gold").textContent = me.gold;
    }

    $("online").textContent =
        Object.values(players).filter(p => p.online).length;

    $("countries").innerHTML = "";

    Object.entries(gameState.countries).forEach(([id,c]) => {
        const div = document.createElement("div");

        div.className = "country";

        if (id === selectedOrigin || id === selectedTarget) {
            div.classList.add("selected");
        }

        const owner = c.owner
            ? countryName(c.owner)
            : "중립";

        div.textContent =
            `${countryName(id)} | ${owner} | 병력 ${c.units}`;

        div.onclick = () => selectCountry(id);

        $("countries").appendChild(div);
    });

    $("playerList").innerHTML = "";

    Object.values(players).forEach(p => {
        const div = document.createElement("div");
        div.className = "country";
        div.textContent =
            `${p.name} (${countryName(p.nation)}) ${p.online ? "●" : "○"}`;
        $("playerList").appendChild(div);
    });

    drawMap();
}

function drawMap() {
    if (!gameState) return;

    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    const w = rect.width;
    const h = rect.height;

    ctx.clearRect(0,0,w,h);

    // 지도 격자
    ctx.strokeStyle = "rgba(150,190,220,0.08)";
    ctx.lineWidth = 1;

    for(let x=0; x<w; x+=40) {
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,h);
        ctx.stroke();
    }

    for(let y=0; y<h; y+=40) {
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(w,y);
        ctx.stroke();
    }

    const positions = {};

    for(const [id,info] of Object.entries(gameState.map)) {
        positions[id] = {
            x:(info.x+180)/360*w,
            y:(90-info.y)/180*h
        };
    }

    // 인접 국가 연결선
    for(const [id,info] of Object.entries(gameState.map)) {
        for(const neighbor of info.neighbors) {
            if (!positions[neighbor]) continue;

            ctx.beginPath();
            ctx.moveTo(positions[id].x,positions[id].y);
            ctx.lineTo(positions[neighbor].x,positions[neighbor].y);
            ctx.strokeStyle = "rgba(160,190,220,0.25)";
            ctx.stroke();
        }
    }

    // 국가 표시
    for(const [id,info] of Object.entries(gameState.map)) {
        const pos = positions[id];
        const country = gameState.countries[id];

        let color = "#718096";

        if(country.owner) {
            color = country.owner === myNation
                ? "#2497e8"
                : "#df654f";
        }

        ctx.beginPath();
        ctx.arc(pos.x,pos.y,9,0,Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if(id === selectedOrigin || id === selectedTarget) {
            ctx.beginPath();
            ctx.arc(pos.x,pos.y,15,0,Math.PI*2);
            ctx.strokeStyle = "#ffe66d";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.textAlign = "center";
        ctx.fillText(info.name,pos.x,pos.y-15);

        ctx.fillStyle = "#c8e6ff";
        ctx.fillText(country.units,pos.x,pos.y+25);
    }
}

canvas.addEventListener("click", event => {
    if (!gameState) return;

    const rect = canvas.getBoundingClientRect();

    const mx = event.clientX - rect.left;
    const my = event.clientY - rect.top;

    let closest = null;
    let distance = Infinity;

    for(const [id,info] of Object.entries(gameState.map)) {
        const x = (info.x+180)/360*rect.width;
        const y = (90-info.y)/180*rect.height;

        const d = Math.hypot(mx-x,my-y);

        if(d < distance) {
            distance = d;
            closest = id;
        }
    }

    if(closest && distance < 30) {
        selectCountry(closest);
    }
});

window.addEventListener("resize",drawMap);
</script>

</body>
</html>

</body>
</html>
